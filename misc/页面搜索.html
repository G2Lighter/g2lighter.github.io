<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<body>
    <style>
        :root {
            --header-color: #fdfbfff3;
            --theme-color: #8969ff;
            --shadow-color: #d4dbd5;
            --ui-border-color: #c9c9c9;
            --text-color: #000000;
            --special-text-color: #fefefe;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --header-color: #2d2d2df0;
                --shadow-color: #131313;
                --ui-border-color: #7b7171;
                --text-color: #e5e5e5;
            }
        }

        ::selection {
            background-color: var(--theme-color);
            color: var(--special-text-color);
        }

        .search-container {
            position: relative;
            display: inline-block;
            margin: 10px 0;
        }

        input[type="text"] {
            padding: 8px 35px 8px 15px;
            border: none;
            border-radius: 20px;
            background: var(--header-color);
            box-shadow: inset 0 -1px 0 var(--shadow-color);
            width: 250px;
            transition: all 0.2s;
            color: var(--text-color);
        }

        input[type="text"]:focus {
            box-shadow: inset 0 -2px 0 var(--theme-color);
            outline: none;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--theme-color);
        }

        hr {
            background-color: var(--theme-color);
            margin: 1.5em 0;
            height: 1px;
            border: none;
        }

        .search-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            display: block;
        }

        * {
            -webkit-tap-highlight-color: none;
        }
    </style>

    <div style="text-align:center">
        <!-- 全站搜索 -->
        <span class="search-title">全站搜索</span>
        <form action="https://search.ipv6s.net/search" id="searchForm">
            <div class="search-container">
                <input
                    placeholder="输入搜索内容..."
                    type="text"
                    name="q"
                    required
                >
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" onclick="document.getElementById('searchForm').requestSubmit()">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0c.41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5S14 7.01 14 9.5S11.99 14 9.5 14z"/>
                </svg>
                <input type="hidden" name="site" value="bloxd.wikidot.com">
            </div>
        </form>

        <hr>

        <!-- 维基搜索 -->
        <span class="search-title">维基搜索</span>
        <form action="javascript:void(0)" id="searchForm2">
            <div class="search-container">
                <input
                    placeholder="输入维基条目..."
                    type="text"
                    id="wikiQ"
                >
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" onclick="document.getElementById('searchForm2').requestSubmit()">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0c.41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5S14 7.01 14 9.5S11.99 14 9.5 14z"/>
                </svg>
            </div>
        </form>
    </div>
    <script src="https://bloxd.wdfiles.com/local--code/_hidden:search/1"></script>
    <script>
        // 全站搜索处理
        document.getElementById('searchForm').onsubmit = function(e) {
            e.preventDefault();
            const q = encodeURIComponent(this.q.value);
            window.open(`https://searx.oloke.xyz/search?q=${q} site:bloxd.wikidot.com`);
        };

        // 维基搜索处理
        document.getElementById('searchForm2').onsubmit = function(e) {
            e.preventDefault();
            const q = document.getElementById('wikiQ').value;
            // 原有维基搜索逻辑
            var str = findKey(JSON.parse(xhr.responseText).item, q);
            if (!str) str = findKey(enr, q);
            if (!str) str = findKey(JSON.parse(xhr.responseText).game, q);
            if (!str) {
                const m = q.split(" ").map(word =>
                    word[0].toUpperCase() + word.substr(1)
                ).join(' ');
                str = findKey(enr, m);
            }
            str = str.replace(/(yellow|white|red|purple|pink|orange|magenta|lime|lightGray|lightBlue|green|gray|cyan|brown|blue|black|Description|Mob)/g, '')
                   .replace(/(extraC|superC|hyperC|ultraC|megaC)/g, 'C')
                   .replace(/StickP/g, 'StickyP')
                   .replace(/worldB/g, 'worldb')
                   .replace(/([a-z])([A-Z])/g, '$1 $2');
            window.open("https://bloxd.wikidot.com/wiki:" + str);
        };

        // 工具函数
        function findKey(obj, value, compare = (a, b) => a === b) {
            return Object.keys(obj).find(k => compare(obj[k], value));
        }

        // 加载翻译数据
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://static2.bloxd.io/translations/zh-Hans.json', true);
        xhr.send();
    </script>
</body>
</html>
