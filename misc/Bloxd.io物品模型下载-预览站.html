<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

        <title>Bloxd.io物品模型下载/预览站</title>

        <!-- Babylon.js -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.6.2/dat.gui.min.js"></script>
        <script src="https://assets.babylonjs.com/generated/Assets.js"></script>
        <script src="https://cdn.babylonjs.com/recast.js"></script>
        <script src="https://cdn.babylonjs.com/ammo.js"></script>
        <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
        <script src="https://cdn.babylonjs.com/cannon.js"></script>
        <script src="https://cdn.babylonjs.com/Oimo.js"></script>
        <script src="https://cdn.babylonjs.com/earcut.min.js"></script>
        <script src="https://cdn.babylonjs.com/babylon.js"></script>
        <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
        <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>
        <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script>
        <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
        <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
        <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>

        <style>
            html, body {
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            #renderCanvas {
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            
            #canvasZone {
                width: 100%;
                height: 100%;
            }
            .div12 {
              height:fit-content;
              text-align: center;
            }
        :root {
            --header-color: #fdfbfff3;
            --theme-color: #8969ff;
            --shadow-color: #d4dbd5;
            --ui-border-color: #c9c9c9;
            --text-color: #000000;
            --special-text-color: #fefefe;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --header-color: #2d2d2df0;
                --shadow-color: #131313;
                --ui-border-color: #7b7171;
                --text-color: #e5e5e5;
            }
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"],
        textarea {
            padding: 5px;
            border: 1px solid var(--ui-border-color);
            width: 100%;
            background: var(--header-color);
            border-radius: 2px;
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            color: var(--text-color);
            -webkit-appearance: none;
        }

        textarea {
            resize: vertical;
        }

        textarea,
        input {
            outline: none;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"],
        input.text,
        textarea {
            border: none;
            box-shadow: inset 0px -1px 0px 0px var(--shadow-color);
            -webkit-box-shadow: inset 0px -1px 0px 0px var(--shadow-color);
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="url"]:focus,
        input[type="password"]:focus,
        input.text:focus,
        textarea:focus {
            box-shadow: inset 0px -2px 0px 0px var(--theme-color);
            -webkit-box-shadow: inset 0px -2px 0px 0px var(--theme-color);
        }

        input[type="submit"],
        input[type="button"],
        button {
            border: 0.5px solid var(--ui-border-color);
            background: var(--header-color);
            color: var(--text-color);
            width: 80px;
            min-width: max-content;
            padding: 2.5px 0;
            margin: 0 5px;
            font-size: 90%;
            transition: all 0.2s;
            -webkit-appearance: none;
        }

        input[type="submit"]:hover,
        input[type="button"]:hover,
        button:hover {
            border-color: var(--theme-color);
            background: var(--theme-color);
            color: var(--special-text-color);
        }

        input[type="submit"]:active,
        input[type="button"]:active,
        button:active {
            border-color: var(--theme-color);
            background: var(--theme-color);
            color: var(--special-text-color);
        }
        </style>
    </head>
<body>
<div class="div12">
<input id="url" type="text" style="width:min-content; min-width: 200px; text-align: center;" placeholder="输入物品名称（区分大小写）">
<div style="height:1em;">

</div>
<button id="button" onclick="geturl(0)">预览模型</button>
<button id="button" onclick="geturl(1)">获取物品模型</button>
    <div id="canvasZone"><canvas id="renderCanvas"></canvas></div>
    <script>
function geturl(t) {
  const url1= document.getElementById("url").value.split(" ");
  for (let i = 0; i < url1.length; i++) {
    url1[i] = url1[i][0].toUpperCase() + url1[i].substr(1);
  };
  if (url1=="Awp") {
    var url3 = "https://static2.bloxd.io/models/AWP.glb";
  }
  else {
    var url3 = "https://static2.bloxd.io/models/".concat(url1.join("%20"), '.glb');
  };


        var canvas = document.getElementById("renderCanvas");

        var startRenderLoop = function (engine, canvas) {
            engine.runRenderLoop(function () {
                if (sceneToRender && sceneToRender.activeCamera) {
                    sceneToRender.render();
                }
            });
        }

        var createDefaultEngine = function() { return new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true,  disableWebGL2Support: false}); };
        var createScene = function () {
    var scene = new BABYLON.Scene(engine);
    var camera = new BABYLON.ArcRotateCamera("Camera", 2, 1.3, 20, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, false);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);
            camera.lowerRadiusLimit = 10;
            camera.upperRadiusLimit = 30;
            camera.useBouncingBehavior = true;
    var light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, -1, 0), scene);
    var light2 = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 1), scene);
    light.intensity = 0.7;
    light2.intensity = 1;
  if (url1=="Awp") {
    BABYLON.SceneLoader.ImportMesh("", "https://static2.bloxd.io/models/", "AWP.glb", scene, function
(newMeshes) {
        if (t==1) {
            window.location.href = url3;
        }
    });
  }
  else {
   BABYLON.SceneLoader.ImportMesh("", "https://static2.bloxd.io/models/", "".concat(url1.join("%20"), '.glb'), scene, function
(newMeshes) {
        if (t==1) {
            window.location.href = url3;
        }
    });
  };

    return scene;
};
                window.initFunction = async function() {
                    
                    
                    
                    var asyncEngineCreation = async function() {
                        try {
                        return createDefaultEngine();
                        } catch(e) {
                        console.log("the available createEngine function failed. Creating the default engine instead");
                        return createDefaultEngine();
                        }
                    }

                    window.engine = await asyncEngineCreation();
        if (!engine) throw 'engine should not be null.';
        startRenderLoop(engine, canvas);
        window.scene = createScene();};
        initFunction().then(() => {sceneToRender = scene                    
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
};
    </script>
</body>
</html>
