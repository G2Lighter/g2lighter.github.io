<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ezplayer for SCP CN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
     height: 100%;
  }
  body {
     width: 100%;
     height: 100%;
    background-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }

  img, video {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    object-fit: contain;
    outline: none;
    display: block;
  }

  audio {
    width: 100%;
    max-width: 600px;
    outline: none;
  }

  .error-hint {
    color: #6e7681;
    font-size: 16px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<script>
  (function () {
    // ==========================================
    // 1. 健壮的 URL 参数提取（防止带参 URL 被截断）
    // ==========================================
    const rawQuery = window.location.search.substring(1);
    
    // 自定义提取函数
    function getParam(name) {
      // 先尝试标准解析
      const params = new URLSearchParams(window.location.search);
      let val = params.get(name);
      if (val !== null) return val;

      // 兜底：正则强行提取，允许 URL 内部包含一些未编码的符号
      const regex = new RegExp('(?:^|&)' + name + '=([^&]*)');
      const match = rawQuery.match(regex);
      return match ? match[1] : null;
    }

    // 提取 src（资源地址）
    // 注意：为了防止 src 本身的参数和播放器参数混淆，我们优先匹配已知的控制参数作为边界
    let mediaUrl = null;
    const knownParams = ['src', 'autoplay', 'loop', 'showUi', 'type'];
    const srcIndex = rawQuery.indexOf('src=');
    
    if (srcIndex !== -1) {
      let rest = rawQuery.substring(srcIndex + 4);
      // 寻找下一个已知参数作为截断点
      let cutIndex = rest.length;
      for (const p of knownParams) {
        if (p === 'src') continue;
        const idx = rest.indexOf('&' + p + '=');
        if (idx !== -1 && idx < cutIndex) {
          cutIndex = idx;
        }
      }
      mediaUrl = rest.substring(0, cutIndex);
      // 解码（如果用户规范地编码了）
      try { mediaUrl = decodeURIComponent(mediaUrl); } catch(e) {}
    }

    // 提取其他控制参数
    const autoPlay = getParam('autoplay') === '1' || getParam('autoplay') === 'true';
    const loop = getParam('loop') === '1' || getParam('loop') === 'true';
    const showUi = getParam('showUi') === '1' || getParam('showUi') === 'true';
    // 可选：强制指定类型
    const forceType = getParam('type');

    // ==========================================
    // 2. 错误处理
    // ==========================================
    function showError(msg) {
      document.body.innerHTML = `<div class="error-hint">${msg}</div>`;
    }

    if (!mediaUrl) {
      showError('请通过 ?src= 参数提供媒体地址');
      return;
    }

    // ==========================================
    // 3. 判断文件类型
    // ==========================================
    // 剥离 URL 参数，只取后缀名
    const urlWithoutQuery = mediaUrl.split('?')[0];
    const extMatch = urlWithoutQuery.match(/\.([a-zA-Z0-9]+)$/);
    const ext = extMatch ? extMatch[1].toLowerCase() : '';

    const imgExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico'];
    const audioExts = ['mp3', 'wav', 'ogg', 'oga', 'aac', 'flac', 'm4a'];
    const videoExts = ['mp4', 'webm', 'ogg', 'ogv', 'mov', 'mkv'];

    let type = forceType;
    if (!type) {
      if (imgExts.includes(ext)) type = 'image';
      else if (audioExts.includes(ext)) type = 'audio';
      else if (videoExts.includes(ext)) type = 'video';
    }

    if (!type) {
      showError('无法识别的媒体类型，请通过 ?type= 指定');
      return;
    }

    // ==========================================
    // 4. 核心：自动播放降级策略
    // ==========================================
    function tryAutoPlay(el) {
      if (!autoPlay) return;

      // 第一重尝试：有声播放
      el.muted = false; 
      const playPromise = el.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          console.log('✅ 有声自动播放成功');
        }).catch((error) => {
          console.warn('⚠️ 有声自动播放被拦截，降级尝试静音播放...', error);
          
          // 第二重尝试：静音播放
          el.muted = true;
          const mutePlayPromise = el.play();
          
          if (mutePlayPromise !== undefined) {
            mutePlayPromise.then(() => {
              console.log('✅ 静音自动播放成功');
            }).catch((err2) => {
              console.error('❌ 静音自动播放同样被拦截', err2);
            });
          }
        });
      }
    }

    // ==========================================
    // 5. 渲染媒体
    // ==========================================
    let element;

    if (type === 'image') {
      element = document.createElement('img');
      element.src = mediaUrl;
      element.alt = 'Image';
      element.onerror = () => showError('图片加载失败');
      
    } else if (type === 'audio') {
      element = document.createElement('audio');
      element.src = mediaUrl;
      element.controls = true; 
      if (loop) element.loop = true;
      element.onerror = () => showError('音频加载失败');
      
    } else if (type === 'video') {
      element = document.createElement('video');
      element.src = mediaUrl;
      
      if (showUi) {
        element.controls = true;
      } else {
        // 如果不显示控件，点击视频切换播放/暂停，并顺便解除静音
        element.onclick = () => {
          if (element.paused) {
            element.play();
            element.muted = false; // 用户点击时尝试开启声音
          } else {
            element.pause();
          }
        };
      }
      
      if (loop) element.loop = true;
      element.onerror = () => showError('视频加载失败');
    }

    // 将媒体元素直接放入 body
    document.body.appendChild(element);

    // ==========================================
    // 6. 执行降级自动播放
    // ==========================================
    if (type === 'audio' || type === 'video') {
      tryAutoPlay(element);
    }
  })();
</script>

</body>
</html>
