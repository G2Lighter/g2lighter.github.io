<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ezplayer for SCP CN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
     height: 100%;
  }
  body {
     width: 100%;
     height: 100%;
    background-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
  }

  img, video {
    width: 100%;
    height: 100%;
    object-fit: contain; /* 默认值 */
    outline: none;
    display: block;
  }

  audio {
    width: 100%;
    max-width: 600px;
    outline: none;
  }

  .error-hint {
    color: #6e7681;
    font-size: 16px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<script>
  (function () {
    // ==========================================
    // 1. 健壮的 URL 参数提取
    // ==========================================
    const rawQuery = window.location.search.substring(1);
    
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      let val = params.get(name);
      if (val !== null) return val;

      const regex = new RegExp('(?:^|&)' + name + '=([^&]*)');
      const match = rawQuery.match(regex);
      return match ? match[1] : null;
    }

    // 提取媒体 URL (支持 src 和 name)
    let mediaUrl = null;
    const knownParams = ['src', 'name', 'autoplay', 'loop', 'showUi', 'type', 'fitMode'];
    const srcIndex = rawQuery.indexOf('src=');
    const nameIndex = rawQuery.indexOf('name=');
    let startIndex = srcIndex !== -1 ? srcIndex + 4 : (nameIndex !== -1 ? nameIndex + 5 : -1);

    if (startIndex !== -1) {
      let rest = rawQuery.substring(startIndex);
      let cutIndex = rest.length;
      for (const p of knownParams) {
        if (p === 'src' || p === 'name') continue;
        const idx = rest.indexOf('&' + p + '=');
        if (idx !== -1 && idx < cutIndex) {
          cutIndex = idx;
        }
      }
      mediaUrl = rest.substring(0, cutIndex);
      try { mediaUrl = decodeURIComponent(mediaUrl); } catch(e) {}
    }

    // 提取其他控制参数
    const autoPlay = getParam('autoplay') === '1' || getParam('autoplay') === 'true';
    const loop = getParam('loop') === '1' || getParam('loop') === 'true';
    const showUi = getParam('showUi') === '1' || getParam('showUi') === 'true';
    const forceType = getParam('type');

    // ==========================================
    // 2. 处理 fitMode 参数
    // ==========================================
    let fitMode = getParam('fitMode') || 'contain';
    const validFitModes = ['contain', 'cover', 'fill', 'none', 'scale-down'];
    if (!validFitModes.includes(fitMode.toLowerCase())) {
      fitMode = 'contain';
    } else {
      fitMode = fitMode.toLowerCase();
    }

    // ==========================================
    // 3. 错误处理
    // ==========================================
    function showError(msg) {
      document.body.innerHTML = `<div class="error-hint">${msg}</div>`;
    }

    const normalizedSrc = (mediaUrl || '').trim().toLowerCase();
    const invalidSrcValues = ['', 'unset', 'none', 'null', 'undefined', 'false', '0'];

    if (!mediaUrl || invalidSrcValues.includes(normalizedSrc)) {
      showError('请通过 name 或 src 参数提供媒体地址');
      return;
    }

    // ==========================================
    // 4. 判断文件类型
    // ==========================================
    const urlWithoutQuery = mediaUrl.split('?')[0];
    const extMatch = urlWithoutQuery.match(/\.([a-zA-Z0-9]+)$/);
    const ext = extMatch ? extMatch[1].toLowerCase() : '';

    const imgExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico'];
    const audioExts = ['mp3', 'wav', 'ogg', 'oga', 'aac', 'flac', 'm4a'];
    const videoExts = ['mp4', 'webm', 'ogg', 'ogv', 'mov', 'mkv'];

    let type = forceType;
    if (!type) {
      if (imgExts.includes(ext)) type = 'image';
      else if (audioExts.includes(ext)) type = 'audio';
      else if (videoExts.includes(ext)) type = 'video';
    }

    if (!type) {
      showError('无法识别的媒体类型');
      return;
    }

    // ==========================================
    // 5. 自动播放降级策略（区分音频和视频）
    // ==========================================
    function tryAutoPlay(el, mediaType) {
      if (!autoPlay) return;

      el.muted = false; 
      const playPromise = el.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          console.log('✅ 有声自动播放成功');
        }).catch((error) => {
          console.warn('⚠️ 有声自动播放被拦截', error);
          
          // 只有视频才降级尝试静音播放
          if (mediaType === 'video') {
            console.warn('视频降级尝试静音播放');
            el.muted = true;
            const mutePlayPromise = el.play();
            
            if (mutePlayPromise !== undefined) {
              mutePlayPromise.then(() => {
                console.log('✅ 静音自动播放成功');
              }).catch((err2) => {
                console.error('❌ 静音自动播放被拦截', err2);
              });
            }
          } else {
            // 音频直接放弃，强制保持不静音
            el.muted = false;
            console.warn('音频自动播放被拦截，等待用户手动播放（不会静音）');
          }
        });
      }
    }

    // ==========================================
    // 6. 渲染媒体
    // ==========================================
    let element;

    if (type === 'image') {
      element = document.createElement('img');
      element.src = mediaUrl;
      element.alt = 'Image';
      element.style.objectFit = fitMode;
      element.onerror = () => showError('图片加载失败');
      
    } else if (type === 'audio') {
      element = document.createElement('audio');
      element.src = mediaUrl;
      element.controls = true; 
      if (loop) element.loop = true;
      element.onerror = () => showError('音频加载失败');
      
    } else if (type === 'video') {
      element = document.createElement('video');
      element.src = mediaUrl;
      element.style.objectFit = fitMode;
      
      if (showUi) {
        element.controls = true;
      } else {
        element.onclick = () => {
          if (element.paused) {
            element.play();
            element.muted = false; 
          } else {
            element.pause();
          }
        };
      }
      
      if (loop) element.loop = true;
      element.onerror = () => showError('视频加载失败');
    }

    document.body.appendChild(element);

    // ==========================================
    // 7. 执行降级自动播放
    // ==========================================
    if (type === 'audio' || type === 'video') {
      tryAutoPlay(element, type);
    }
  })();
</script>

</body>
</html>
